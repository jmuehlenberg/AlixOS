# AlixOS Xorg input configuration for Amiga input devices

Section "InputClass"
    Identifier "AlixOS Keyboard"
    MatchProduct "AlixOS Amiga Keyboard"
    MatchIsKeyboard "on"
    Driver "evdev"
    Option "XkbLayout" "us"
EndSection

Section "InputClass"
    Identifier "AlixOS Mouse"
    MatchProduct "AlixOS Amiga Mouse"
    MatchIsPointer "on"
    Driver "evdev"
    Option "AccelerationProfile" "1"
    Option "AccelerationNumerator" "2"
    Option "AccelerationDenominator" "1"
EndSection

Section "InputClass"
    Identifier "AlixOS Joystick"
    MatchProduct "AlixOS Amiga Joystick"
    MatchIsJoystick "on"
    Driver "evdev"
EndSection
